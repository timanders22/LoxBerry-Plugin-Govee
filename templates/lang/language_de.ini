[LOX]
H_TITEL = "Schritt für Schritt"
S1_T = "Weg festlegen"
S1 = "Es gibt zwei Richtungen, und sie sind unabhängig voneinander.<br><b>Zustand lesen</b> &mdash; der Regelweg ist MQTT: der Dienst fragt die Leuchten ab und veröffentlicht die Werte, das Gateway legt die virtuellen Eingänge selbst an. Wer lieber abholt, nimmt den virtuellen Eingang aus Schritt 3.<br><b>Schalten</b> &mdash; für Ein/Aus, Helligkeit und Farbe ist der <b>virtuelle Ausgang</b> der beste Weg: Loxone schickt das UDP-Paket unmittelbar an die Leuchte, der LoxBerry wird dafür gar nicht gebraucht und kann sogar aus sein. Für Szenen, Balken und Segmente gilt dasselbe &mdash; nur sind die Befehle dort so lang, dass sich der fertige virtuelle Ausgang aus Schritt 5 lohnt."
S2_T = "Abo im MQTT-Gateway eintragen"
S2 = "Unter <i>System &rarr; MQTT Gateway &rarr; Subscriptions</i>:"
S3_T = "Virtuelle Eingänge anlegen"
S3 = "Diese Werte liefert der Endpunkt je Gerät. Der Knopf weiter unten erzeugt die fertige Importdatei; die Tabelle bleibt trotzdem stehen, denn sie erklärt, was importiert wird."
T_TITEL = "Titel"
T_EINHEIT = "Einheit"
T_BEDEUTUNG = "Bedeutung"
IMPORT_WARNUNG = "Loxone Config legt beim Import neu an und überschreibt nichts. Zweimal importiert heißt doppelte Objekte."
KEINE_GERAETE = "Es ist noch kein Gerät eingerichtet. Bitte zuerst im Reiter Einstellungen eintragen."
S4_T = "Befehle senden"
S4 = "Ein virtueller Ausgang auf den LoxBerry mit diesen Adressen. Alle schaltenden Aufrufe brauchen den Haken <i>Schreibende Befehle zulassen</i> im Reiter Einstellungen und einen laufenden Dienst."
S4_ODER = "<b>Oder ohne LoxBerry:</b> Der virtuelle Ausgang aus Schritt 5 spricht unmittelbar mit der Leuchte über <span class='sm-mono'>/dev/udp/&lt;IP&gt;/4003</span>. Das ist der schnellere Weg und er läuft auch weiter, wenn der LoxBerry gerade neu startet. Der Umweg über den LoxBerry lohnt nur, wenn Sie den Zustand zurückgemeldet bekommen wollen."
S5_T = "Ausfallerkennung"
S5 = "Virtuelle Eingänge behalten ihren letzten Wert. Antwortet eine Leuchte nicht mehr, steht in der App weiter der alte Wert, und alles sieht normal aus. Deshalb liefert der Endpunkt <span class='sm-mono'>OK</span> und <span class='sm-mono'>ALTER</span> mit: <span class='sm-mono'>OK=0</span> heißt, die Werte sind alt. Fehlt ein Einzelwert ganz, sendet der Endpunkt einen Strich statt einer erfundenen 0 &mdash; Loxone behält dann den letzten Wert, und der Ausfall wird über ALTER sichtbar. Die Schwelle für eine Meldung deutlich über den Abholtakt legen, damit ein einzelner verpasster Durchlauf keine Meldung auslöst."
H_VORLAGEN = "Importdateien für Loxone Config"
VORLAGEN_ERKLAERUNG = "Je Gerät gibt es bis zu drei Dateien. <b>Grundbefehle</b> und <b>Szenen und Balken</b> sind virtuelle Ausgänge und sprechen unmittelbar mit der Leuchte. <b>Zustand</b> ist ein virtueller Eingang und holt die Werte vom LoxBerry. Die Adresse im Kopf ist ein Vorschlag &mdash; bitte prüfen Sie, ob der Miniserver den LoxBerry unter diesem Namen erreicht."
