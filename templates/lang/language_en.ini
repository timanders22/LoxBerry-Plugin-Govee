EB_DIGITAL = "Do not activate “Use as digital input” – 0/1 values also arrive as a number, and -1 means “not reported”."
EB_RECHTE = "The LoxBerry user on the Miniserver needs rights on these inputs (Config: user management)."
EB_MUSTER = "Whoever copies the pages of the sample project gets the inputs as well."
EB_S5_T = "Commands via MQTT"
EB_S5 = "Continuous colour, scene by id and bar – and, if you like, on/off, brightness and colour temperature – are sent by Loxone to the UDP input of the MQTT gateway (port %d). The command bridge of the plugin accepts them and calls the same function as the HTTP endpoint. Under gateway V1 and V2 nothing has to be entered or ticked for commands. Loxone sends “publish”, never “retain” – a retained command is never executed."
EB_S5_HAKEN = "In the plugin: tick “%s” (tab MQTT, off by default); switching commands additionally need “%s” (tab “%s”). Without the tick the bridge answers “abgelehnt” (rejected)."
EB_S5_THEMA = "Topic per light: %s – “alle” instead of geraet<N> goes to every configured light."
EB_S5_QUITTUNG = "The answer is on <topic>/quittung (“angenommen” or “abgelehnt: …”), never retained; it is meant for the Test tab and the log, not for Loxone. “übergeben” (handed over) means: sent to the light – UDP does not acknowledge, the next poll shows whether it arrived. “abgelehnt: OHNE_ANTWORT” means: queued, but the service did not answer within the waiting time – the command may still take effect. The same value to the same light within 60 s does not go out again (command brake of the plugin, answer “angenommen”)."
EB_S5_VORLAGE = "The template creates its own output “Govee MQTT-Befehle” in Loxone Config (address /dev/udp/<LoxBerry>/<UDP port>), commands “Govee <action> Gerät <N> (MQTT)”. In the sample project colour, scene and bar are on the shared output “LoxBerry MQTT-Gateway” (“Govee: …”) – if you have that, you only need the template for further commands."
EB_S5_KEINE = "The command bridge cannot be loaded: %s"
K_VQ_MQTT = "MQTT commands (virtual output)"
EB_S6_T = "Directly to the light"
EB_S6 = "The virtual outputs <b>basic commands</b> and <b>scenes and bars</b> talk to the light directly via <span class='sm-mono'>/dev/udp/&lt;IP&gt;/4003</span> – fast and independent of the LoxBerry, even while it restarts, but only with fixed values (brightness and colour temperature as analogue value). The address in the header is the IP of the light from the Settings tab."
EB_BISHER = "Existing installations (HTTP)"
EB_BISHER_TEXT = "Only for installations that are already connected via HTTP: virtual HTTP input with token, output “via the LoxBerry”. New installations use MQTT (steps 1 to 5) – just not both at once for the same light. If a value is missing, it reads -1 there since 0.9.30 instead of a dash; the template “State” allows -1 for this (no new import needed if you set MinVal to -1 by hand)."
EB_HTTP_S3 = "The endpoint delivers these values per device. The button further down creates the ready import file; the table stays anyway because it explains what gets imported."

