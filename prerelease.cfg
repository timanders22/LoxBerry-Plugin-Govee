# Vorabfassungen fuer alle, die sie ausdruecklich einschalten.
#
# Solange keine eigene Vorabfassung gepflegt wird, stehen hier dieselbe Fassung
# und dieselben Adressen wie in der release.cfg. Damit wird niemandem etwas
# angeboten - und zugleich laeuft der Abruf nicht ins Leere: PRERELEASECFG ist
# in der plugin.cfg gesetzt, eine fehlende Datei ergaebe dort eine 404 mit
# einer Fehlermeldung, die niemand zuordnen kann.
#
# Eine prerelease.cfg OHNE VERSION-Zeile waere der schlechteste Fall: wird sie
# doch einmal ausgewertet, gilt "keine Version" je nach Lesart als aeltere -
# das Plugin wuerde sich selbst herunterstufen.
#
# Sobald es eine echte Vorabfassung gibt, wird hier - und NUR hier - erhoeht.

