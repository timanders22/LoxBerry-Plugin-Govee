GERAETE_ERKLAERUNG = "<b>LAN</b> is the normal way: the light is addressed directly on the home network, without an account and without internet. <b>Cloud</b> is only meant for devices that cannot do LAN Control — scenes and segments are not possible there. Reserve fixed IP addresses in the router, otherwise the setting points nowhere after the router reboots."
GERAETE_HILFE = "<b>As a rule you do not have to fill these fields in by hand.</b> <i>Search devices</i> enters SKU and device id for every LAN device it finds; for cloud devices the device list further down this page does the same. By hand is the exception — for instance when the light does not answer on the network yet.<br><b>SKU</b> is the model number (stock keeping unit — the article number under which the manufacturer keeps a model): an <span class='sm-mono'>H</span> and four characters, for example <span class='sm-mono'>H61A8</span> or <span class='sm-mono'>H6076</span>. It is printed on the control box or the power supply, shown in the Govee app under the device settings, and given on the manufacturer's product page as the line <i>Model: H61A8 (10 m)</i> — <a href='https://eu.govee.com/de-de/products/govee-rgbic-outdoor-neon-rope-light' target='_blank' rel='noopener'>example of a product page</a>. The plugin needs it because a recorded scene only fits the model it was recorded on.<br><b>Device id</b> identifies the individual light (digits, A to F and colons, like a MAC address). It is needed <b>for the cloud path only</b>; on the LAN the IP address is enough. Find it in this plugin's cloud device list or in the Govee app under the device settings.<br><b>Pixel</b> is the number of individually controllable pixels in the graffiti mode of the Govee app — on the H6076 floor lamp that is 14 groups of 6 LEDs, on the H70C4 string it is 10 segments. You can count them in the app's graffiti view; the product page does not give the number. If the field stays empty, the bar display and the segment commands are blocked for that device; they are then rejected instead of being sent into the void.<br><b>K min</b> and <b>K max</b> bound the colour temperature. The white-tone slider of the Govee app shows both ends; they are also in the device manual, but as a rule not on the product page. If the fields stay empty, 2700 and 6500 kelvin apply; values outside are rejected."
