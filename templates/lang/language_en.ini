[MQTT]
ABO_GEMESSEN = "(measured: gateway&nbsp;V%d)"
ABO_TEXT = "The topic group of this plugin is:"
ABO_UNBEKANNT = "The version of your MQTT gateway could not be determined. <b>Version&nbsp;1:</b> without this entry nothing arrives at the Miniserver. <b>Version&nbsp;2 and newer:</b> the topic group appears by itself under Subscriptions, nothing needs to be entered."
ABO_V2 = "<b>MQTT gateway V2 detects the topic group by itself</b> — nothing needs to be entered here. The group appears under <i>Subscriptions</i>; tick the data points you want there. If it does not appear, nothing has been published yet."
ABO_WARNUNG = "Without this entry nothing arrives at the Miniserver. It is by far the most common cause of failure. The line belongs under <i>System → MQTT Gateway</i> in the <i>Subscriptions</i> section; save afterwards."
ERKLAERUNG = "The MQTT gateway has been part of the system since LoxBerry 3 — it is not installed afterwards, it is switched on under <i>System → MQTT Gateway</i>. The broker name is set to <span class='sm-mono'>localhost</span> out of the box; whether messages can arrive is told by the autostart setting alone."
H_ABO = "The subscription in the gateway"
H_THEMEN = "Published topics"
H_ZUSTAND = "Gateway state"
N_ERKLAERUNG = "<b>N</b> stands for the number of the device from the list in the Settings tab — the first device is 1. Values that an answering light does not deliver (an, hell, kelvin, r, g, b) go out as -1; an invented 0 would be a silent false statement. States (column retained) are kept by the broker until a new value comes. Only what has changed is sent; the full set comes at the start of the service and every 30 minutes. status/zaehler changes in every round of the service, status/befehle is sent by the command bridge every minute. If a light no longer answers (erreichbar 0), only erreichbar, alter and fehl go out. A device removed from the list reports erreichbar 0, alter -1 and fehl -1 once, and its retained topics are cleared; uninstalling clears all retained topics under this prefix."
THEMEN_ERKLAERUNG = "The gateway does not create anything in Loxone by itself. For every topic Loxone should evaluate, create a virtual input with exactly the name from the name table (tab <i>Loxone integration</i>, step 3)."
T_AUTOSTART = "Gateway set to autostart"
T_BEDEUTUNG = "Meaning"
T_BROKER = "Broker"
T_GEFUNDEN = "general.json found"
T_RETAINED = "retained"
T_THEMA = "Topic"
T_UDP = "UDP input port"
WARNUNG_AUS = "The gateway is not set to autostart. The service sends anyway, but nobody is listening. Please switch it on under <i>System → MQTT Gateway</i>."
L_BEFEHLE = "Accept commands via MQTT"
H_BEFEHLE = "Off by default. Anyone in the home network can send commands via the UDP input of the MQTT gateway. Switching only works in addition with “Allow write commands” (tab Settings); polling the state works without."
ABO_V1_DATEI = "<b>Gateway V1:</b> the plugin brings the subscription itself (file <span class='sm-mono'>mqtt_subscriptions.cfg</span> in the configuration folder, updated when saving this tab) – nothing to enter."
