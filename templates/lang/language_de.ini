[LOX]
H_TITEL = "Schritt für Schritt"
S1_T = "Weg festlegen"
S1 = "Es gibt zwei Richtungen.<br><b>Zustand lesen</b> — über MQTT: der Dienst fragt die Leuchten ab und veröffentlicht die Werte über das MQTT-Gateway. In Loxone legen Sie dafür Virtuelle Eingänge mit genau den Namen aus Schritt 3 an – das Gateway legt in Loxone nichts selbst an. Das ist der Weg des Musterprojekts.<br><b>Schalten</b> — Ein/Aus, Helligkeit, Weiß, feste Farben und Szenen gehen weiter <b>unmittelbar</b> über die virtuellen Ausgänge aus Schritt 6 an die Leuchte; das wirkt auch ohne LoxBerry. Stufenlose Farbe, Szene nach Kennung und der Balken gehen über MQTT-Befehle an das Plugin (Schritt 5).<br>Der Weg über HTTP (virtueller HTTP-Eingang, Ausgang mit Token) bleibt für bestehende Anlagen – zugeklappt am Ende dieses Reiters."
S2_T = "Das MQTT-Gateway"
S2 = "Die Themengruppe dieses Plugins lautet:"
S3_T = "Virtuelle Eingänge anlegen"
S3 = "Für jedes Thema, das Loxone auswerten soll, in Loxone Config unter <i>Virtuelle Eingänge</i> einen <b>Virtuellen Eingang</b> (bei Text: <b>Virtueller Texteingang</b>) mit genau diesem Namen anlegen. Keine Importvorlage für Werte – die Spalte „im Musterprojekt“ sagt, welche Eingänge die Musterseiten brauchen."
T_TITEL = "Titel"
T_EINHEIT = "Einheit"
T_BEDEUTUNG = "Bedeutung"
IMPORT_WARNUNG = "Loxone Config legt beim Import neu an und überschreibt nichts. Zweimal importiert heißt doppelte Objekte."
KEINE_GERAETE = "Es ist noch kein Gerät eingerichtet. Bitte zuerst im Reiter Einstellungen eintragen."
S4_T = "Befehle senden"
S4 = "Ein virtueller Ausgang auf den LoxBerry mit diesen Adressen. Alle schaltenden Aufrufe brauchen den Haken <i>Schreibende Befehle zulassen</i> im Reiter Einstellungen und einen laufenden Dienst."
S4_ODER = "<b>Oder ohne LoxBerry:</b> Der virtuelle Ausgang aus Schritt 5 spricht unmittelbar mit der Leuchte über <span class='sm-mono'>/dev/udp/&lt;IP&gt;/4003</span>. Das ist der schnellere Weg und er läuft auch weiter, wenn der LoxBerry gerade neu startet. Der Umweg über den LoxBerry lohnt nur, wenn Sie den Zustand zurückgemeldet bekommen wollen."
S5_T = "Ausfallerkennung"
S5 = "Virtuelle Eingänge behalten ihren letzten Wert: steht der LoxBerry, der Abrufdienst oder das MQTT-Gateway, sieht in der App alles normal aus. Deshalb sendet der Dienst das Lebenszeichen %s – es zählt bei jeder Dienstrunde eins weiter (0 bis 999, ab Werk alle 30 s, nie retained). An eine Analogwertvalidierung anschließen: Tmc 300 s (mindestens das Fünffache des Abfragetakts), Min 0, Max 999, Konstante 1 an En und den Haken bei ‚En‘ im Eigenschaftsfenster entfernen – ihr Ausgang E meldet den Ausfall. %s an einem NICHT meldet, wenn die Leuchte nicht antwortet. Ein Alter aus einem Zeitstempel braucht es nicht; ts und lebt dienen nur der Anzeige."
H_VORLAGEN = "Importdateien für Loxone Config"
VORLAGEN_ERKLAERUNG = "Je Gerät gibt es bis zu vier Dateien. <b>Grundbefehle</b> und <b>Szenen und Balken</b> sind virtuelle Ausgänge und sprechen unmittelbar mit der Leuchte — schnell und unabhängig vom LoxBerry, aber nur mit festen Werten. <b>Stufenlos über den LoxBerry</b> ist ebenfalls ein virtueller Ausgang, geht aber über den Endpunkt: dort trägt jeder Befehl einen Analogwert, also stufenlose Helligkeit, Farbe als Zahl, jede Szenenkennung und einen Balken in Prozentschritten. <b>Zustand</b> ist ein virtueller Eingang und holt die Werte vom LoxBerry. Die Adresse im Kopf ist ein Vorschlag — bitte prüfen Sie, ob der Miniserver den LoxBerry unter diesem Namen erreicht."
K_VQ = "Grundbefehle (virtueller Ausgang)"
K_VQ_SZENEN = "Szenen und Balken (virtueller Ausgang)"
K_VI = "Zustand (virtueller Eingang)"
K_VQ_LOX = "Stufenlos über den LoxBerry (virtueller Ausgang)"
FEHLER_VORLAGE = "Für dieses Gerät gibt es diese Vorlage nicht. Virtuelle Ausgänge sind nur für den LAN-Weg möglich."
H_SAMMEL = "Ein Eingang für alle Leuchten"
SAMMEL_ERKLAERUNG = "Statt je Gerät einen virtuellen Eingang holt diese eine Datei alle Werte in einem Abruf. Bei acht Leuchten sind das ein Abruf je Takt statt acht. <b>Entweder</b> diese Datei <b>oder</b> die Einzeldateien oben einlesen — die Titel dieser Datei tragen das Präfix <span class='sm-mono'>GOVEE_ALLE_</span> und unterscheiden sich damit von denen der Einzeldateien; zweimal eingelesen sind trotzdem zwei Bausteine auf derselben Adresse."
K_VI_ALLE = "Zustand aller Leuchten (ein virtueller Eingang)"
H_TOKEN = "Token"
TOKEN_ERKLAERUNG = "Das Token schützt den Endpunkt im unangemeldeten Bereich. Es steckt in allen Adressen im Miniserver."
K_TOKEN_NEU = "Token neu würfeln"
TOKEN_NEU = "Es wurde ein neues Token erzeugt. Alle Adressen im Miniserver müssen jetzt angepasst werden."
T_AKTION = "Aktion"
T_ADRESSE = "Adresse"
S6_T = "Baustein-Listen zum Nachbauen"
S6 = "Drei Seiten aus dem LoxBerry-Plugins Musterprojekt, dort in Loxone Config gebaut und verbunden: <b>„Govee“</b> zeigt, ob alles läuft und was die Leuchte tut (für jeden), <b>„Govee Licht“</b> schaltet, dimmt und färbt die Leuchte unmittelbar, <b>„Govee Szenen und Balken“</b> zeigt Szenen, Segmente und die PV-Leistung als Balken. Je Seite: Anleitung, Tabelle (von oben nach unten abarbeiten), Hinweise und Bild. Die Namen gelten für die erste eingerichtete Leuchte (ohne Leuchte für „Lichtleiste“, Gerät 1, wie im Musterprojekt). Die Bausteine findet Loxone Config über die Baustein-Suche (F5)."
B_TYP = "Baustein (Typ)"
