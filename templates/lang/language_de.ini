[BAUSTEIN]
SCHRITTE_TITEL = "So übernehmen Sie diese Seite"
HINWEISE_TITEL = "Hinweise"
S1_SCHRITT1 = "In der Govee-App bei der Leuchte „LAN Control“ einschalten und ihr im Router eine feste IP-Adresse geben."
S1_SCHRITT2 = "Im Plugin Reiter „%s“ → „%s“, dann Reiter „%s“ → „%s“ (oder Name und IP von Hand eintragen), bei Lichtstreifen die Pixelzahl ergänzen, speichern und „%s“. Reiter „%s“ → „%s“: eine Zeile mit OK=1 muss kommen."
S1_SCHRITT3 = "Im Plugin Reiter „MQTT“ den Haken „%s“ setzen (ab Werk an). In Loxone Config die Virtuellen Eingänge aus der Namenstabelle anlegen (Reiter „%s“, Schritt 3), Namen genau so: Nr. 1–10 und 19; „Als Digitaleingang verwenden“ nicht aktivieren. Unter Gateway V2 die Datenpunkte der Hakenliste anhaken (Schritt 2)."
S1_SCHRITT4 = "Seite „Govee“ anlegen, die Virtuellen Eingänge Nr. 1–10 und 19 darauf ziehen, dazu die Konstante 1 (Nr. 11, Baustein-Suche F5, Wert 1). Die Benachrichtigung „Meldung Plugin gestört (Govee)“ anlegen (Peripherie → Mitteilungen → Benachrichtigung), Text wie in der Tabelle; sie bekommt genau eine Leitung."
S1_SCHRITT5 = "Übrige Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Tabelle, von oben nach unten verbinden. An der Analogwertvalidierung Nr. 12 den Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an). Status „Leuchte (Govee)“: vorher dreimal „+“ klicken (V5–V7); die Zeilen in der angegebenen Reihenfolge eintragen, die ohne Bedingung zuletzt."
S1_SCHRITT6 = "Speichern und in den Miniserver übertragen. Probe: „Zustand (Govee)“ zeigt „läuft – Wert … s alt“, „Leuchte (Govee)“ zeigt, was die Leuchte gerade tut, „Befehlsweg (Govee)“ den Befehlsdienst, und govee_status_zaehler ändert sich alle 30 s."
S1_H1 = "Die Meldung kommt erst nach 10 Minuten Störung; ein Neustart der Leuchte oder des Dienstes meldet nichts. Auch eine Leuchte, die am Netzschalter aus ist, meldet nach 10 Minuten – wer sie bewusst stromlos schaltet, legt diesen Zustand über ein UND vor Nr. 15 still."
S1_H2 = "Zu Nr. 4 und 12: govee_status_zaehler ist das Lebenszeichen des Abrufdienstes; es zählt bei jeder Dienstrunde eins weiter (ab Werk alle 30 s). Steht der LoxBerry, der Dienst oder das MQTT-Gateway, behalten alle Eingänge ihren letzten Wert – nur das stehende Lebenszeichen verrät es. Wer im Plugin einen längeren Abfragetakt einstellt, setzt Tmc auf mindestens das Fünffache."
S1_H3 = "Mehrere Leuchten: je Leuchte dieselben Eingänge mit ihrer Nummer (govee_geraet2_…, govee_geraet3_… – die Namenstabelle zeigt sie je Leuchte) und dieselben Bausteine; das Lebenszeichen govee_status_zaehler gibt es nur einmal. Die Störungen über weitere ODER (je zwei Eingänge) vor Nr. 15 führen – nie mehrere Quellen direkt an die Benachrichtigung."
S1_H5 = "Das Musterprojekt nimmt MQTT. Wer eine bestehende Anlage mit der HTTP-Zustandsvorlage hat, findet sie unter „%s“ am Ende dieses Reiters – nur nicht beides zugleich."
S2_SCHRITT1 = "Reiter „%s“ → beim Gerät „%s“ herunterladen und in Loxone Config im Baum „Virtuelle Ausgänge“ → „Vordefinierte Geräte → Vorlage importieren…“ (einmal). Nr. 24 kommt aus dem Ausgang „LoxBerry MQTT-Gateway“ der gleichnamigen Musterseite bzw. aus der Vorlage „%s“ (Schritt 5). Im Plugin die Haken „%s“ (Reiter MQTT) und „%s“ (Reiter „%s“) setzen."
S2_SCHRITT2 = "Seite „Govee Licht“ anlegen, die zehn Ausgangsbefehle der Tabelle ziehen (Nr. 3, 5, 7, 9, 11, 13, 15, 17 und 19 aus „GOVEE Lichtleiste“, Nr. 24 „Govee: Farbe als Zahl“ aus „LoxBerry MQTT-Gateway“), dazu „Niemand zu Hause (eigene Quelle)“ (im eigenen Projekt die eigene Anwesenheit, sonst einen Schalter dieses Namens anlegen)."
S2_SCHRITT3 = "Den Dimmer „Lichtleiste (Govee)“ über die Baustein-Suche (F5) setzen (Min 0, Max 100), den Begrenzer Nr. 4 auf Min 0 / Max 100 stellen (Config legt Max 10 an), vier Schieberegler und sechs Tasten anlegen und die Formel Nr. 23 eintragen."
S2_SCHRITT4 = "Verbinden wie in der Tabelle: Ausgang Q des Dimmers an „Lichtleiste - Ein/Aus“, Ausgang AQ über den Begrenzer an „Lichtleiste - Helligkeit“, „Niemand zu Hause (eigene Quelle)“ an den Eingang Off des Dimmers."
S2_SCHRITT5 = "Speichern und übertragen. Probe: den Dimmer in der App auf 50 stellen – die Leuchte geht an und dimmt; „Leuchte (Govee)“ auf der Seite „Govee“ zeigt es nach spätestens einer Minute."
S2_H1 = "Ein/Aus, Helligkeit, Weiß und die festen Farben gehen UNMITTELBAR an die Leuchte und wirken auch, wenn der LoxBerry aus ist. Nur die stufenlose Farbe (Nr. 24) geht über den LoxBerry (MQTT)."
S2_H2 = "Zu Nr. 4: Min 0 lassen, nicht auf 1 anheben – am 18.10.2026 an einer H61A8 gemessen: Helligkeit 1 schaltet die ausgeschaltete Leuchte wieder ein, Helligkeit 0 lässt sie aus. Ausgeschaltet wird über Nr. 3."
S2_H3 = "Je Leuchte EINEN Weg für Ein/Aus und Helligkeit: entweder wie hier unmittelbar oder über den LoxBerry mit dem Befehl Helligkeit der Vorlage „%s“ (Thema govee/befehl/geraet1/helligkeit; dort schaltet 0 aus – dann AQ des Dimmers direkt an diesen Befehl und Nr. 3 bis 5 weglassen)."
S2_H4 = "Eine Farbtaste kann eine ausgeschaltete Leuchte einschalten (manche Modelle); der Dimmer weiß davon nichts – „Leuchte (Govee)“ zeigt den wahren Zustand."
S2_H5 = "Dieselbe Farbe über den LoxBerry geht binnen 60 s nicht ein zweites Mal hinaus (Befehlsbremse des Plugins); nach einer festen Farbtaste wirkt derselbe Reglerwert deshalb erst nach einer Minute."
S2_H6 = "Über die Cloud eingebundene Leuchten haben keine Grundbefehle und keine Szenen; dort gehen Ein/Aus, Helligkeit, Farbtemperatur und Farbe nur über die MQTT-Befehle der Vorlage „%s“."
S2_H7 = "Die Lichtsteuerung von Loxone ginge auch, steht aber nicht als Muster im Projekt; der Dimmer genügt für eine Leuchte. Der Befehl „Status abfragen“ im Behälter bleibt frei – seine Antwort geht an den Dienst auf dem LoxBerry, für Loxone ist der virtuelle Eingang da."
S3_SCHRITT1 = "Reiter „%s“ → beim Gerät „%s“ herunterladen und in Loxone Config einlesen (die Pixelzahl muss vorher im Plugin stehen, sonst fehlen Balken und Segmente). Nr. 12 und 16 kommen aus dem Ausgang „LoxBerry MQTT-Gateway“ (Musterseite) bzw. der Vorlage „%s“ – Haken wie auf der Seite „Govee Licht“."
S3_SCHRITT2 = "Seite „Govee Szenen und Balken“ anlegen, die sieben Ausgangsbefehle der Tabelle ziehen (Nr. 2, 4, 6, 8 und 10 aus „GOVEE Lichtleiste Szenen“, Nr. 12 und 16 aus „LoxBerry MQTT-Gateway“), dazu „PV-Leistung (eigene Quelle)“ (im eigenen Projekt die Leistung des eigenen Wechselrichters)."
S3_SCHRITT3 = "Fünf Tasten, den Schieberegler „Szenenkennung (Govee)“, den Schalter „PV-Balken zeigen (Govee)“ (Baustein-Suche F5) und die Formel Nr. 15 anlegen (Funktionsnamen groß); in der Formel 1000 an die eigene Anlage anpassen (ein Zehntel der Spitzenleistung in W)."
S3_SCHRITT4 = "Verbinden wie in der Tabelle, speichern und übertragen. Probe: „Taste Kerzenlicht (Govee)“ – bei einer Leuchte der Reihe H70C4 erscheint die Szene; bei anderen Leuchten im Plugin Reiter „%s“ die Szenen durchprobieren."
S3_H1 = "Szenen hängen am Modell. Der Behälter bringt alle 14 aufgezeichneten Szenen (H70C4, H6076, RGBIC) mit – weitere Tasten nach demselben Muster; eigene Szenen im Plugin hinterlegen und die Vorlage neu holen."
S3_H2 = "Der PV-Balken übernimmt die Leuchte, solange der Schalter EIN ist; beim Ausschalten wird der Balken leer – danach eine Farbe wählen. Ein Befehl geht nur beim Stufenwechsel hinaus (Stufen zu 10 Prozent), weil der Balken nicht unter die Befehlsbremse fällt."
S3_H3 = "Für den Balken ohne LoxBerry stehen im Behälter elf feste Stufen (0, 10 … 100 Prozent) – dafür bräuchte es einen Status mit elf Ausgängen; der stufenlose Befehl Nr. 16 ist einfacher."
S3_H4 = "Zu Nr. 11 und 12: welche Kennung was zeigt, sagt nur der Versuch – im Plugin Reiter „%s“ → „%s“."
S3_H5 = "Leuchten über die Cloud kennen weder Szenen noch Balken; ohne Pixelzahl gibt es keine Balken und Segmente."
