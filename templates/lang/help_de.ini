; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Govee"
K02 = "Bindet Govee-Leuchten an Loxone an — <b>ohne Cloud, ohne Konto und ohne Internet</b>, solange die Leuchte LAN Control beherrscht."
K03 = "Voraussetzung: LAN Control"
K04 = "In der Govee-App je Leuchte: <i>Gerät → Einstellungen → LAN Control</i> einschalten. Ohne diesen Schalter antwortet die Leuchte im Heimnetz auf gar nichts — weder auf die Suche noch auf einen Befehl. Anschließend im Router eine feste IP-Adresse reservieren, sonst zeigt die Einstellung nach dem nächsten Neustart des Routers ins Leere."
K05 = "Der Port 4002 — warum es einen Dienst gibt"
K06 = "Jede Govee-Leuchte schickt ihre Antwort an <b>UDP-Port 4002 des Anfragenden</b>. Diesen Port kann im ganzen Rechner nur ein einziges Programm halten. Deshalb fragt <b>nur der Abrufdienst</b> die Leuchten ab; Oberfläche und Miniserver reichen ihre Wünsche über eine Warteschlange an ihn weiter. Läuft der Dienst nicht, kommen keine Zustandswerte an — das ist die mit Abstand häufigste Ursache, wenn nichts passiert."
K07 = "Drei Wege"
K08 = "<b>LAN</b> — der Regelweg. UDP-Port 4003, Befehle: ein, aus, Helligkeit, Farbe, Farbtemperatur. Loxone kann diese Befehle sogar unmittelbar an die Leuchte schicken, ohne Umweg über den LoxBerry."
K09 = "<b>ptReal</b> — derselbe Weg, aber mit den BLE-Befehlen, die die Govee-App sonst per Bluetooth schickt. Damit werden <b>Szenen</b>, der <b>Musikbetrieb</b> und die <b>Segment- und Pixelsteuerung</b> erreichbar, die die dokumentierte Schnittstelle nicht kennt. Das Plugin baut diese Befehle selbst, samt XOR-Prüfsumme und Aufteilung auf mehrere Pakete."
K10 = "<b>Zwei Segmentverfahren.</b> <i>Graffiti</i> spricht einzelne Pixel an und ist an der Stehlampe H6076 gemessen; <i>Bitmaske</i> spricht ganze Segmente an und ist die Form, die bei der Lichterkette H70C4 wirkt. Welches Verfahren Ihre Leuchte versteht, sagt nur der Versuch — im Reiter <i>Test</i> stehen beide zur Auswahl, und der Endpunkt nimmt <span class='sm-mono'>&amp;verfahren=maske</span> entgegen."
K11 = "<b>Cloud</b> — nur für Geräte ohne LAN Control. Braucht Internet, ein Govee-Konto und einen API-Schlüssel und kann nur die Grundbefehle."
K12 = "So gehen Sie vor"
K13 = "<b>Test:</b> Knopf <i>Geräte im Netz suchen</i>. Es melden sich alle Leuchten mit eingeschaltetem LAN Control."
K14 = "<b>Einstellungen:</b> <i>Gefundene Geräte übernehmen</i>, dann Namen und <b>Pixelzahl</b> ergänzen und speichern. Ohne Pixelzahl sind Balken und Segmente gesperrt."
K15 = "<b>Dienst starten.</b>"
K16 = "<b>Test:</b> Die Selbstprüfung sagt Zeile für Zeile, ob es trägt. Jedes Kreuz nennt die Abhilfe mit."
K17 = "<b>MQTT:</b> Das Abo im MQTT-Gateway eintragen. Ohne diesen Eintrag kommt am Miniserver nichts an. <b>Gilt für MQTT&#8209;Gateway&nbsp;V1.</b> Ab Fassung&nbsp;2 erscheint die Themengruppe von selbst in den Subscriptions; einzutragen ist dann nichts."
K18 = "<b>Einbindung in Loxone:</b> Schritt für Schritt, mit vollständiger Baustein-Liste und fertigen Importdateien für Loxone Config."
K19 = "Was das Plugin nicht kann"
K20 = "Govee vergibt Szenenkennungen und die Form der Segmentbefehle <b>je Modellreihe</b>. Der mitgelieferte Szenenkatalog stammt von der Stehlampe H6076, der Lichterkette H70C4 und einem RGBIC-Streifen. Der Selbsttest beweist, dass dieses Plugin dieselben Bytes baut wie die Govee-App — er beweist <b>nicht</b>, dass Ihre Leuchte sie versteht. Was bei Ihrem Modell wirkt, sagt nur der Versuch. Wer die Befehlsfolge seiner eigenen Leuchte kennt, kann seit 0.9.9 <b>eigene Szenen hinterlegen</b> (Reiter Einstellungen, Tabelle <i>Eigene Szenen</i>); sie werden beim Speichern auf Länge und Prüfsumme geprüft und stehen danach überall dort, wo auch der Katalog steht."
K21 = "Bei manchen Leuchten (zum Beispiel der Lichterkette H7025) ist die BLE-Kommunikation verschlüsselt. Befehle lassen sich dort nicht mehr mitschneiden — über ptReal gesendet funktionieren sie trotzdem, man muss sie nur bei einer ähnlichen Leuchte finden."
K22 = "Manche Leuchten gehen <b>nicht</b> mit dem Ein-Befehl an, sondern nur mit einem Farbbefehl. Wenn <i>Einschalten</i> nichts bewirkt, probieren Sie <i>Farbe senden</i>."
K23 = "Herkunft der Angaben"
K24 = "Die dokumentierte LAN-Schnittstelle stammt aus der Herstelleranleitung (<span class='sm-mono'>app-h5.govee.com/user-manual/wlan-guide</span>), die ptReal-Systematik und alle aufgezeichneten Szenen aus dem Beitrag <i>Govee: BLE &gt; local API — Segmentsteuerung / Szenen</i> von MarkusCosi im Loxforum, die Cloud-Schnittstelle aus <span class='sm-mono'>developer.govee.com/reference</span>. Nichts davon ist geraten."
