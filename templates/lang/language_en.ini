[LOX]
H_TITEL = "Step by step"
S1_T = "Choose the path"
S1 = "There are two directions and they are independent of each other.<br><b>Reading state</b> — the normal way is MQTT: the service polls the lights and publishes the values, and the gateway creates the virtual inputs by itself. If you prefer to pull, use the virtual input from step 3.<br><b>Switching</b> — for on/off, brightness and colour the <b>virtual output</b> is the best way: Loxone sends the UDP packet straight to the light, the LoxBerry is not needed at all and may even be off. The same holds for scenes, bars and segments — only there the commands are so long that the ready made virtual output from step 5 pays off."
S2_T = "The subscription in the MQTT gateway"
S2 = "The topic group of this plugin is:"
S3_T = "Create virtual inputs"
S3 = "These are the values the endpoint delivers per device. The button further down creates the ready made import file; the table stays nevertheless, because it explains what is being imported."
T_TITEL = "Title"
T_EINHEIT = "Unit"
T_BEDEUTUNG = "Meaning"
IMPORT_WARNUNG = "Loxone Config creates new objects on import and overwrites nothing. Importing twice means duplicate objects."
KEINE_GERAETE = "No device has been configured yet. Please enter one on the Settings tab first."
S4_T = "Send commands"
S4 = "A virtual output pointing at the LoxBerry with these addresses. Every switching call needs the tick <i>Allow write commands</i> on the Settings tab and a running service."
S4_ODER = "<b>Or without the LoxBerry:</b> the virtual output from step 5 talks to the light directly through <span class='sm-mono'>/dev/udp/&lt;IP&gt;/4003</span>. That is the faster way and it keeps working while the LoxBerry is rebooting. Going through the LoxBerry is only worth it if you want the state reported back."
S5_T = "Failure detection"
S5 = "Virtual inputs keep their last value. If a light stops answering, the app still shows the old value and everything looks normal. That is why the endpoint delivers <span class='sm-mono'>OK</span> and <span class='sm-mono'>ALTER</span>: <span class='sm-mono'>OK=0</span> means the values are stale. If a single value is missing the endpoint sends a dash instead of an invented 0 — Loxone then keeps the last value and the outage becomes visible through ALTER. Set the alarm threshold well above the polling interval so a single missed pass does not raise a message. <span class='sm-mono'>FEHL</span> counts consecutive failures and thereby separates a brief hiccup from an outage lasting hours. MQTT additionally carries a heartbeat: if <span class='sm-mono'>lebt</span> stays put while <span class='sm-mono'>ts</span> ages, it is not the light that is gone but the service."
H_VORLAGEN = "Import files for Loxone Config"
VORLAGEN_ERKLAERUNG = "There are up to four files per device. <b>Basic commands</b> and <b>scenes and bars</b> are virtual outputs and talk to the light directly — fast and independent of the LoxBerry, but only with fixed values. <b>Continuous through the LoxBerry</b> is a virtual output as well but goes through the endpoint: there every command carries an analogue value, so continuous brightness, colour as a number, any scene id and a bar in percent steps. <b>State</b> is a virtual input and pulls the values from the LoxBerry. The address in the header is a suggestion — please check that the Miniserver can reach the LoxBerry under that name."
K_VQ = "Basic commands (virtual output)"
K_VQ_SZENEN = "Scenes and bars (virtual output)"
K_VI = "State (virtual input)"
K_VQ_LOX = "Continuous through the LoxBerry (virtual output)"
FEHLER_VORLAGE = "This template does not exist for this device. Virtual outputs are only possible on the LAN path."
H_SAMMEL = "One input for all lights"
