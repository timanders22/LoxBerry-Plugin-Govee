EB_DIGITAL = "„Als Digitaleingang verwenden“ nicht aktivieren – auch 0/1-Werte kommen als Zahl, und -1 heißt „nicht gemeldet“."
EB_RECHTE = "Der LoxBerry-Benutzer am Miniserver braucht Rechte auf diese Eingänge (Config: Benutzerverwaltung)."
EB_MUSTER = "Wer die Seiten des Musterprojekts kopiert, bekommt die Eingänge mit."
EB_S5_T = "Befehle über MQTT"
EB_S5 = "Stufenlose Farbe, Szene nach Kennung und Balken – und wer mag auch Ein/Aus, Helligkeit und Farbtemperatur – schickt Loxone an den UDP-Eingang des MQTT-Gateways (Port %d). Die Befehlsbrücke des Plugins nimmt sie an und ruft dieselbe Funktion wie der HTTP-Endpunkt. Unter Gateway V1 und V2 ist für Befehle nichts einzutragen oder anzuhaken. Loxone sendet „publish“, nie „retain“ – ein zurückbehaltener Befehl wird nie ausgeführt."
EB_S5_HAKEN = "Im Plugin: Haken „%s“ (Reiter MQTT, ab Werk aus); schaltende Befehle brauchen zusätzlich „%s“ (Reiter „%s“). Ohne Haken antwortet die Brücke mit „abgelehnt“."
EB_S5_THEMA = "Thema je Leuchte: %s – „alle“ statt geraet<N> geht an jede eingerichtete Leuchte."
EB_S5_QUITTUNG = "Die Antwort steht auf <Thema>/quittung („angenommen“ oder „abgelehnt: …“), nie retained; sie ist für den Reiter Test und das Protokoll da, nicht für Loxone. „übergeben“ heißt: an die Leuchte gesendet – UDP quittiert nicht, ob es ankam, zeigt die nächste Abfrage. „abgelehnt: OHNE_ANTWORT“ heißt: eingereiht, aber der Dienst antwortete nicht in der Wartezeit – der Befehl kann trotzdem noch wirken. Derselbe Wert an dieselbe Leuchte binnen 60 s geht nicht erneut hinaus (Befehlsbremse des Plugins, Antwort „angenommen“)."
EB_S5_VORLAGE = "Die Vorlage legt in Loxone Config einen eigenen Ausgang „Govee MQTT-Befehle“ an (Adresse /dev/udp/<LoxBerry>/<UDP-Port>), Befehle „Govee <Aktion> Gerät <N> (MQTT)“. Im Musterprojekt stehen Farbe, Szene und Balken am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ („Govee: …“) – wer jenen hat, braucht die Vorlage nur für weitere Befehle."
EB_S5_KEINE = "Die Befehlsbrücke ist nicht ladbar: %s"
K_VQ_MQTT = "MQTT-Befehle (virtueller Ausgang)"
EB_S6_T = "Unmittelbar an die Leuchte"
EB_S6 = "Die virtuellen Ausgänge <b>Grundbefehle</b> und <b>Szenen und Balken</b> sprechen über <span class='sm-mono'>/dev/udp/&lt;IP&gt;/4003</span> unmittelbar mit der Leuchte – schnell und unabhängig vom LoxBerry, auch wenn er gerade neu startet, aber nur mit festen Werten (Helligkeit und Farbtemperatur als Analogwert). Die Adresse im Kopf ist die IP der Leuchte aus dem Reiter Einstellungen."
EB_BISHER = "Bisherige Anlagen (HTTP)"
EB_BISHER_TEXT = "Nur für Anlagen, die schon über HTTP eingebunden sind: virtueller HTTP-Eingang mit Token, Ausgang „über den LoxBerry“. Neue Anlagen nehmen MQTT (Schritte 1 bis 5) – nur nicht beides zugleich für dieselbe Leuchte. Fehlt ein Wert, steht dort seit 0.9.30 -1 statt eines Strichs; die Vorlage „Zustand“ erlaubt dafür -1 (neu einlesen nicht nötig, wer MinVal von Hand auf -1 setzt)."
