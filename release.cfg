[AUTOUPDATE]
# Diese Datei liegt im Wurzelverzeichnis des GitHub-Repositories und steuert
# dort das Auto-Update. Eine release.cfg ohne VERSION-Zeile waere der
# schlechteste Fall: wird sie abgerufen, ist das Verhalten undefiniert.
#
# Bei jedem Release drei Stellen gleichzeitig anfassen, sonst greift das
# Auto-Update nicht:
#   1. plugin.cfg  -> VERSION
#   2. release.cfg -> VERSION und BEIDE Adressen auf den neuen Tag
#   3. auf GitHub ein Release mit genau diesem Tag (vX.Y.Z)
#
# Zwei Adressen, zwei verschiedene Quellen - das ist die haeufigste
# Fehlerstelle: die plugin.cfg liest DIESE Datei aus dem ZWEIG main, das
# ARCHIVEURL unten zieht aber aus dem TAG. Wer hier etwas aendert, ohne den Tag
# mitzuziehen, liefert an neue Installationen weiter den alten Stand aus.
#
# Danach ueber raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Govee/
# main/release.cfg gegenpruefen - und die Archivadresse gegen eine erfundene
# Fassung testen: die echte laedt herunter, die erfundene zeigt 404.

VERSION=0.9.4
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Govee/archive/refs/tags/v0.9.4.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Govee/releases/tag/v0.9.4
