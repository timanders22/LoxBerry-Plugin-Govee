B3_PARAM = "Range 1 to 100"
B3_EIN = "Output AQ of the lighting controller through an analogue limiter 1..100"
B4_TYP = "Virtual output command <span class='sm-mono'>Colour temperature</span> (analogue)"
B4_PARAM = "Range from the device K min and K max"
B4_EIN = "Analogue memory or daily curve; see the note on #4"
