[AUTHOR]
NAME=Govee Plugin Authors
EMAIL=govee@users.noreply.github.com

[PLUGIN]
VERSION=0.9.5
NAME=govee
FOLDER=govee
TITLE=Govee

[AUTOUPDATE]
# Seit 0.9.1 gibt es ein eigenes Repository - Auto-Update ist damit an.
#
# Die Adressen zeigen ausschliesslich dorthin. Auf ein FREMDES Repository
# duerfen sie nie zeigen: LoxBerry vergleicht Fassungen als Zahl, ein fremdes
# 2021.05.14 waere groesser als 0.9.1, und daraus wuerde ein stilles Downgrade
# auf ein voellig anderes Plugin. Genau das ist beim Docker-Plugin schon
# einmal passiert.
#
# Bei jedem weiteren Release: VERSION hier UND in release.cfg erhoehen, beide
# Adressen dort auf den neuen Tag setzen, das Release mit genau diesem Tag
# anlegen - und danach nachpruefen, dass der Tag wirklich existiert.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Govee/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Govee/main/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Mindestens 3.0.0: das Plugin liest config/system/general.json. Mit 2.0 liesse
# es sich installieren und liefe dann nicht.
LB_MINIMUM=3.0.0
# Keine Obergrenze. plugininstall.pl ruft bei Ueberschreitung &fail() - die
# Installation wird abgebrochen, nicht nur gewarnt.
LB_MAXIMUM=false
# SYSTEM.ARCHITECTURE wird von plugininstall.pl gelesen und danach nie
# benutzt. Eine Angabe verhindert also nichts, waere aber eine unwahre
# Aussage - das Plugin ist reines PHP und laeuft ueberall.
ARCHITECTURE=false
