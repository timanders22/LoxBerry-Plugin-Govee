; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Govee"
K02 = "Connects Govee lights to Loxone — <b>without the cloud, without an account and without internet</b>, as long as the light supports LAN Control."
K03 = "Prerequisite: LAN Control"
K04 = "In the Govee app, for each light: <i>Device → Settings → LAN Control</i>, switch it on. Without that switch the light answers nothing at all on the home network — neither the discovery nor a command. Afterwards reserve a fixed IP address in the router, otherwise the setting points nowhere after the router is next restarted."
K05 = "Port 4002 — why there is a service"
K06 = "Every Govee light sends its reply to <b>UDP port 4002 of the requester</b>. Only one single program on the whole machine can hold that port. That is why <b>only the polling service</b> queries the lights; the interface and the Miniserver pass their wishes to it through a queue. If the service is not running, no state values arrive — by far the most common cause when nothing happens."
K07 = "Three paths"
K08 = "<b>LAN</b> — the normal path. UDP port 4003, commands: on, off, brightness, colour, colour temperature. Loxone can even send these commands straight to the light, without going through the LoxBerry."
K09 = "<b>ptReal</b> — the same path, but carrying the BLE commands the Govee app otherwise sends over Bluetooth. This makes <b>scenes</b>, <b>music mode</b> and <b>segment and pixel control</b> reachable, none of which the documented interface knows. The plugin builds these commands itself, including the XOR checksum and the split across several packets."
K10 = "<b>Two segment methods.</b> <i>Graffiti</i> addresses individual pixels and was measured on the H6076 floor lamp; <i>bit mask</i> addresses whole segments and is the form that works on the H70C4 string light. Which method your light understands is something only a trial will tell — the <i>Test</i> tab offers both, and the endpoint accepts <span class='sm-mono'>&amp;verfahren=maske</span>."
K11 = "<b>Cloud</b> — only for devices without LAN Control. Needs internet, a Govee account and an API key, and can only do the basic commands."
K12 = "How to proceed"
K13 = "<b>Test:</b> button <i>Search for devices on the network</i>. Every light with LAN Control switched on will report in."
K14 = "<b>Settings:</b> <i>Adopt discovered devices</i>, then add names and the <b>pixel count</b> and save. Without a pixel count, bars and segments stay locked."
K15 = "<b>Start the service.</b>"
K16 = "<b>Test:</b> the self-check tells you line by line whether it holds. Every failed line names the remedy."
K17 = "<b>MQTT:</b> enter the subscription in the MQTT gateway. Without that entry nothing arrives at the Miniserver."
K18 = "<b>Loxone integration:</b> step by step, with a complete list of blocks and ready-made import files for Loxone Config."
K19 = "What the plugin cannot do"
K20 = "Govee assigns scene identifiers and the form of the segment commands <b>per model range</b>. The scene catalogue supplied here comes from the H6076 floor lamp, the H70C4 string light and an RGBIC strip. The self-test proves that this plugin builds the same bytes as the Govee app — it does <b>not</b> prove that your light understands them. What works on your model is something only a trial will tell."
K21 = "On some lights (the H7025 string light, for example) the BLE communication is encrypted. Commands can no longer be captured there — sent through ptReal they still work, you just have to find them on a similar light."
K22 = "Some lights do <b>not</b> come on with the on command, only with a colour command. If <i>Switch on</i> has no effect, try <i>Send colour</i>."
K23 = "Where the information comes from"
K24 = "The documented LAN interface comes from the manufacturer's manual (<span class='sm-mono'>app-h5.govee.com/user-manual/wlan-guide</span>), the ptReal scheme and all recorded scenes from the post <i>Govee: BLE &gt; local API — segment control / scenes</i> by MarkusCosi in the Loxforum, the cloud interface from <span class='sm-mono'>developer.govee.com/reference</span>. None of it is guesswork."
