KOPF_SZENEN = "Govee ptReal über die LAN-API, UDP-Port 4003, Gerät %s. Jeder Befehl ist eine aufgezeichnete BLE-Befehlsfolge der Govee-App; bei einer anderen Modellreihe kann eine Szene nichts oder etwas anderes bewirken. Die Segmentbefehle sind feste Muster - die freie Form geht über den Endpunkt mit aktion=segment. Zweimal eingelesen sind zwei Bausteine: Loxone Config legt beim Import neu an und überschreibt nichts."
