; Govee - language file English
;
; English is the fallback level, not German: whoever has set a third language
; is more likely to understand English. This file must therefore always be
; complete - every key used in the PHP has to be here.
;
; Rules (house standard):
;   - EVERY value is in double quotes. parse_ini_file treats ';' as the start
;     of a comment, so an unquoted value would be cut off there - and that hits
;     every HTML entity: →, –, — all end in a semicolon.
;   - No further double quote inside a value. Quote HTML attributes with
;     single quotes: <span class='sm-mono'>.

