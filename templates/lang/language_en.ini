[BAUSTEIN]
SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
S1_SCHRITT1 = "In the Govee app switch on “LAN Control” for the light and give it a fixed IP address in the router."
S1_SCHRITT2 = "In the plugin tab “%s” → “%s”, then tab “%s” → “%s” (or enter name and IP by hand), add the pixel count for light strips, save and “%s”. Tab “%s” → “%s”: a line with OK=1 must appear."
S1_SCHRITT3 = "In the plugin tab “MQTT” set the tick “%s” (on by default). In Loxone Config create the virtual inputs from the name table (tab “%s”, step 3), names exactly like that: no. 1–10 and 19; do not activate “Use as digital input”. Under gateway V2 tick the data points of the tick list (step 2)."
S1_SCHRITT4 = "Create the page “Govee”, drag the virtual inputs no. 1–10 and 19 onto it, plus the constant 1 (no. 11, block search F5, value 1). Create the notification “Meldung Plugin gestört (Govee)” (Periphery → Messages → Notification), text as in the table; it gets exactly one connection."
S1_SCHRITT5 = "Place the remaining blocks via the block search (key F5), parameters as in the table, connect from top to bottom. On the Value Validator no. 12 remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise constant 1 arrives as 0). Status “Leuchte (Govee)”: click “+” three times first (V5–V7); enter the rows in the given order, the one without condition last."
S1_SCHRITT6 = "Save and transfer to the Miniserver. Check: “Zustand (Govee)” shows “läuft – Wert … s alt”, “Leuchte (Govee)” shows what the light is doing, “Befehlsweg (Govee)” the command service, and govee_status_zaehler changes every 30 s."
S1_H1 = "The message only comes after 10 minutes of fault; a restart of the light or the service reports nothing. A light that is switched off at the mains also reports after 10 minutes – if you cut its power on purpose, silence this state with an AND in front of no. 15."
S1_H2 = "On no. 4 and 12: govee_status_zaehler is the sign of life of the polling service; it counts up by one with every round of the service (every 30 s by default). If the LoxBerry, the service or the MQTT gateway stands still, all inputs keep their last value – only the standing sign of life reveals it. Whoever sets a longer polling interval in the plugin sets Tmc to at least five times that."
S1_H3 = "Several lights: per light the same inputs with its number (govee_geraet2_…, govee_geraet3_… – the name table shows them per light) and the same blocks; the sign of life govee_status_zaehler exists only once. Lead the faults through further ORs (two inputs each) in front of no. 15 – never several sources directly to the notification."
S1_H5 = "The sample project uses MQTT. Whoever has an existing installation with the HTTP state template finds it under “%s” at the end of this tab – just not both at once."
S2_SCHRITT1 = "Tab “%s” → download “%s” at the device and in Loxone Config in the tree “Virtual Outputs” → “Predefined devices → Import template…” (once). No. 24 comes from the output “LoxBerry MQTT-Gateway” of the sample page of the same name or from the template “%s” (step 5). In the plugin set the ticks “%s” (tab MQTT) and “%s” (tab “%s”)."
S2_SCHRITT2 = "Create the page “Govee Licht”, drag the ten output commands of the table (no. 3, 5, 7, 9, 11, 13, 15, 17 and 19 from “GOVEE Lichtleiste”, no. 24 “Govee: Farbe als Zahl” from “LoxBerry MQTT-Gateway”), plus “Niemand zu Hause (eigene Quelle)” (in your own project your own presence, otherwise create a switch of this name)."
S2_SCHRITT3 = "Place the dimmer “Lichtleiste (Govee)” via the block search (F5) (Min 0, Max 100), set the limiter no. 4 to Min 0 / Max 100 (Config creates Max 10), create four sliders and six push buttons and enter the formula no. 23."
S2_SCHRITT4 = "Connect as in the table: output Q of the dimmer to “Lichtleiste - Ein/Aus”, output AQ via the limiter to “Lichtleiste - Helligkeit”, “Niemand zu Hause (eigene Quelle)” to the input Off of the dimmer."
S2_SCHRITT5 = "Save and transfer. Check: set the dimmer to 50 in the app – the light switches on and dims; “Leuchte (Govee)” on the page “Govee” shows it within one minute."
S2_H1 = "On/off, brightness, white and the fixed colours go DIRECTLY to the light and also work when the LoxBerry is off. Only the continuous colour (no. 24) goes through the LoxBerry (MQTT)."
S2_H2 = "On no. 4: keep Min 0, do not raise it to 1 – measured on an H61A8 on 18.10.2026: brightness 1 switches the switched-off light back on, brightness 0 leaves it off. Switching off is done via no. 3."
S2_H3 = "Per light ONE path for on/off and brightness: either directly as here or through the LoxBerry with the brightness command of the template “%s” (topic govee/befehl/geraet1/helligkeit; there 0 switches off – then AQ of the dimmer directly to this command and leave out no. 3 to 5)."
S2_H4 = "A colour button can switch on a light that is off (some models); the dimmer knows nothing about it – “Leuchte (Govee)” shows the true state."
S2_H5 = "The same colour through the LoxBerry does not go out a second time within 60 s (command brake of the plugin); after a fixed colour button the same slider value therefore only takes effect after one minute."
S2_H6 = "Lights connected via the cloud have no basic commands and no scenes; there on/off, brightness, colour temperature and colour only go through the MQTT commands of the template “%s”."
S2_H7 = "The Lighting Controller of Loxone would also work, but has no pattern in the project; the dimmer is enough for one light. The command “Status abfragen” in the container stays free – its answer goes to the service on the LoxBerry, the virtual input is there for Loxone."
S3_SCHRITT1 = "Tab “%s” → download “%s” at the device and import it in Loxone Config (the pixel count must be in the plugin first, otherwise bars and segments are missing). No. 12 and 16 come from the output “LoxBerry MQTT-Gateway” (sample page) or the template “%s” – ticks as on the page “Govee Licht”."
S3_SCHRITT2 = "Create the page “Govee Szenen und Balken”, drag the seven output commands of the table (no. 2, 4, 6, 8 and 10 from “GOVEE Lichtleiste Szenen”, no. 12 and 16 from “LoxBerry MQTT-Gateway”), plus “PV-Leistung (eigene Quelle)” (in your own project the power of your own inverter)."
S3_SCHRITT3 = "Create five push buttons, the slider “Szenenkennung (Govee)”, the switch “PV-Balken zeigen (Govee)” (block search F5) and the formula no. 15 (function names in capitals); adapt 1000 in the formula to your own system (a tenth of the peak power in W)."
S3_SCHRITT4 = "Connect as in the table, save and transfer. Check: “Taste Kerzenlicht (Govee)” – on a light of the H70C4 series the scene appears; on other lights try the scenes in the plugin tab “%s”."
S3_H1 = "Scenes depend on the model. The container brings all 14 recorded scenes (H70C4, H6076, RGBIC) – further buttons in the same way; store your own scenes in the plugin and fetch the template again."
S3_H2 = "The PV bar takes over the light as long as the switch is ON; when switching off the bar becomes empty – then choose a colour. A command only goes out when the step changes (steps of 10 percent), because the bar is not subject to the command brake."
S3_H3 = "For the bar without LoxBerry the container holds eleven fixed steps (0, 10 … 100 percent) – that would need a status with eleven outputs; the continuous command no. 16 is simpler."
S3_H4 = "On no. 11 and 12: which id shows what, only trying tells – in the plugin tab “%s” → “%s”."
S3_H5 = "Lights via the cloud know neither scenes nor bars; without a pixel count there are no bars and segments."
Z1_01 = "Virtual input (name as assigned by the MQTT gateway, plugin Govee) | govee_geraet1_erreichbar | 1 = the value of the light is current (last answer at most three times the polling interval old, 90 s by default), 0 = stale or never delivered | —"
Z1_02 = "Virtual input (name as assigned by the MQTT gateway, plugin Govee) | govee_geraet1_alter | seconds since the last answer of the light, computed when sending (comes on change, at least every 30 minutes); -1 = never | —"
Z1_03 = "Virtual input (name as assigned by the MQTT gateway, plugin Govee) | govee_geraet1_fehl | polls in a row without an answer of the light; 0 = the last one worked; -1 = the light was removed from the list in the plugin | —"
Z1_04 = "Virtual input (name as assigned by the MQTT gateway, plugin Govee) | govee_status_zaehler | sign of life of the polling service, 0 to 999 – counts up by one with every round of the service (every 30 s by default, never retained) as long as LoxBerry, service and MQTT gateway are running | —"
Z1_05 = "Virtual input (name as assigned by the MQTT gateway, plugin Govee) | govee_geraet1_an | 1 = light on, 0 = off; -1 = the light does not report it | —"
Z1_06 = "Virtual input (name as assigned by the MQTT gateway, plugin Govee) | govee_geraet1_hell | brightness in %% (0 to 100); -1 = the light does not report it | —"
Z1_07 = "Virtual input (name as assigned by the MQTT gateway, plugin Govee) | govee_geraet1_kelvin | colour temperature in K; 0 = the light shows a colour; -1 = the light does not report it | —"
Z1_08 = "Virtual input (name as assigned by the MQTT gateway, plugin Govee) | govee_geraet1_r | red component 0 to 255; -1 = not reported | —"
Z1_09 = "Virtual input (name as assigned by the MQTT gateway, plugin Govee) | govee_geraet1_g | green component 0 to 255; -1 = not reported | —"
Z1_10 = "Virtual input (name as assigned by the MQTT gateway, plugin Govee) | govee_geraet1_b | blue component 0 to 255; -1 = not reported | —"
Z1_11 = "Constant | Konstante 1 | value 1 | —"
Z1_12 = "Value Validator | Lebenszeichen fehlt (Govee) | Tmc 300 s (ten rounds of the service at 30 s; whoever sets a longer polling interval in the plugin takes at least five times that), Min 0, Max 999 – if the LoxBerry, the polling service or the MQTT gateway stands still, the sign of life stays put; remove the tick at ‘En’ in the properties window | V = #4, En = #11"
Z1_13 = "NOT | Keine frischen Daten (Govee) | — (the light does not answer) | I = #1"
Z1_14 = "OR | Störung (Govee) | — (no fresh data or sign of life missing) | I1 = #13, I2 = output E of #12"
Z1_15 = "Switch-On Delay | Störung bestätigt (Govee) | 600 s (a restart of the light or the service reports nothing) | Input = #14"
Z1_16 = "Notification | Meldung Plugin gestört (Govee) | Text: Govee – no fresh values of the light strip for 10 minutes: the light does not answer (power, Wi-Fi, LAN Control in the Govee app) or the LoxBerry, the polling service or the MQTT gateway stands still. Read the status “Zustand (Govee)” in the app | Input = #15"
Z1_17 = "Status | Zustand (Govee) | rows: V1 = 1 “sign of life missing for at least 5 minutes – LoxBerry, polling service or MQTT gateway stands still; open the LoxBerry in the browser, in the plugin tab Settings ‘Start service’, check tab MQTT”; V3 < 0 “never a value – enter the light in the plugin tab Settings (first switch on ‘LAN Control’ in the Govee app), then ‘Start service’”; V2 = 0 “light does not answer – last value <v3> s ago, <v4> polls without answer; check power and Wi-Fi of the light, in the plugin tab Test ‘Query state (device 1)’”; V4 > 0 “running – the last poll got no answer (<v4> times in a row), value <v3> s old”; without condition “running – value <v3> s old”; visualisation ON | V1 = output E of #12, V2 = #1, V3 = #2, V4 = #3"
Z1_18 = "Status | Leuchte (Govee) | rows: V7 = 0 “unknown – the light does not answer (status ‘Zustand (Govee)’)”; V1 = -1 “unknown – the light does not report an on/off state”; V1 = 0 “off”; V3 > 0 “on – white light <v3> K, brightness <v2> %%”; without condition “on – colour red <v4>, green <v5>, blue <v6>, brightness <v2> %%”; visualisation ON | V1 = #5, V2 = #6, V3 = #7, V4 = #8, V5 = #9, V6 = #10, V7 = #1"
Z2_01 = "Dimmer | Lichtleiste (Govee) | Min 0, Max 100; switchable and dimmable in the app; talks to the light directly through the template “GOVEE Lichtleiste” (LoxBerry not needed) | Off = #2"
Z2_02 = "Virtual input (switch) | Niemand zu Hause (eigene Quelle) | 1 = everybody is away (further instance, the same placeholder as on “Alexa NG” and “Kodi-NG Wiedergabe”); switches the light strip off and keeps it off as long as nobody is home | —"
Z2_03 = "Virtual output command (template “GOVEE Lichtleiste”) | Lichtleiste - Ein/Aus | command on ON: light on, on OFF: off | Input = output Q of #1"
Z2_04 = "Analog MinMax Limiter | Helligkeit 0 bis 100 (Govee) | Min 0, Max 100 (do not raise to 1: measured on an H61A8 on 18.10.2026 – brightness 1 switches the switched-off light back on, brightness 0 leaves it off; switching off is done via no. 3) | Input = output AQ of #1"
Z2_05 = "Virtual output command (template “GOVEE Lichtleiste”) | Lichtleiste - Helligkeit | brightness 0 to 100 %% (0 when switching off – the light stays off) | Input = output AQ of #4"
Z2_06 = "Virtual input (slider) | Farbtemperatur (Govee) | Min 2700, Max 6500, step 100, start value 4000 (K; limits as in the plugin under K min/K max) | —"
Z2_07 = "Virtual output command (template “GOVEE Lichtleiste”) | Lichtleiste - Farbtemperatur | white light in K, continuous | Input = #6"
Z2_08 = "Virtual input (push button) | Taste Warmweiß (Govee) | in the app | —"
Z2_09 = "Virtual output command (template “GOVEE Lichtleiste”) | Lichtleiste - Warmweiß 2700 K | command on ON: white light 2700 K | Input = #8"
Z2_10 = "Virtual input (push button) | Taste Neutralweiß (Govee) | in the app | —"
Z2_11 = "Virtual output command (template “GOVEE Lichtleiste”) | Lichtleiste - Neutralweiß 4000 K | command on ON: white light 4000 K | Input = #10"
Z2_12 = "Virtual input (push button) | Taste Kaltweiß (Govee) | in the app | —"
Z2_13 = "Virtual output command (template “GOVEE Lichtleiste”) | Lichtleiste - Kaltweiß 6500 K | command on ON: white light 6500 K | Input = #12"
Z2_14 = "Virtual input (push button) | Taste Rot (Govee) | in the app | —"
Z2_15 = "Virtual output command (template “GOVEE Lichtleiste”) | Lichtleiste - Farbe Rot | command on ON: colour red | Input = #14"
Z2_16 = "Virtual input (push button) | Taste Grün (Govee) | in the app | —"
Z2_17 = "Virtual output command (template “GOVEE Lichtleiste”) | Lichtleiste - Farbe Grün | command on ON: colour green | Input = #16"
Z2_18 = "Virtual input (push button) | Taste Blau (Govee) | in the app | —"
Z2_19 = "Virtual output command (template “GOVEE Lichtleiste”) | Lichtleiste - Farbe Blau | command on ON: colour blue | Input = #18"
Z2_20 = "Virtual input (slider) | Farbe Rotanteil (Govee) | Min 0, Max 255, step 1, start value 255 | —"
Z2_21 = "Virtual input (slider) | Farbe Grünanteil (Govee) | Min 0, Max 255, step 1, start value 136 | —"
Z2_22 = "Virtual input (slider) | Farbe Blauanteil (Govee) | Min 0, Max 255, step 1, start value 0 | —"
Z2_23 = "Formula | Farbe als Zahl (Govee) | I1*65536+I2*256+I3 (red, green, blue into one number 0 to 16777215 – so a single command carries the whole colour) | I1 = #20, I2 = #21, I3 = #22"
Z2_24 = "Virtual output command (template “LoxBerry MQTT-Gateway”) | Govee: Farbe als Zahl | command at analogue value: publish govee/befehl/geraet1/farbe <v.0> (never retain); colour continuous 0 to 16777215; goes through the LoxBerry: needs the running service and in the plugin the ticks “Accept commands via MQTT” (tab MQTT) and “Allow write commands” (tab Settings) | Input = #23"
Z3_01 = "Virtual input (push button) | Taste Kerzenlicht (Govee) | in the app | —"
Z3_02 = "Virtual output command (template “GOVEE Lichtleiste Szenen”) | Lichtleiste - Kerzenlicht (H70C4) | command on ON: scene candlelight; recorded on the model series H70C4 – on another light it acts differently or not at all | Input = #1"
Z3_03 = "Virtual input (push button) | Taste Sonnenuntergang (Govee) | in the app | —"
Z3_04 = "Virtual output command (template “GOVEE Lichtleiste Szenen”) | Lichtleiste - Sonnenuntergang (H70C4) | command on ON: scene sunset (H70C4) | Input = #3"
Z3_05 = "Virtual input (push button) | Taste Sternenhimmel (Govee) | in the app | —"
Z3_06 = "Virtual output command (template “GOVEE Lichtleiste Szenen”) | Lichtleiste - Sternenhimmel (H70C4) | command on ON: scene starry sky (H70C4) | Input = #5"
Z3_07 = "Virtual input (push button) | Taste Segmente rot und blau (Govee) | in the app | —"
Z3_08 = "Virtual output command (template “GOVEE Lichtleiste Szenen”) | Lichtleiste - Untere Hälfte rot, obere blau | command on ON: lower half of the pixels red, upper half blue (graffiti method; needs the pixel count in the plugin) | Input = #7"
Z3_09 = "Virtual input (push button) | Taste Segmente aus (Govee) | in the app | —"
Z3_10 = "Virtual output command (template “GOVEE Lichtleiste Szenen”) | Lichtleiste - Alle Segmente aus | command on ON: all pixels dark | Input = #9"
Z3_11 = "Virtual input (slider) | Szenenkennung (Govee) | Min 0, Max 255, step 1, start value 0; only for those who know the scene id of their light (try it in the plugin tab Test with “Send scene by id”) | —"
Z3_12 = "Virtual output command (template “LoxBerry MQTT-Gateway”) | Govee: Szene nach Kennung | command at analogue value: publish govee/befehl/geraet1/szene <v.0> (never retain); scene with the set id 0 to 255; goes through the LoxBerry: needs the running service and in the plugin the ticks “Accept commands via MQTT” (tab MQTT) and “Allow write commands” (tab Settings) | Input = #11"
Z3_13 = "Virtual input | PV-Leistung (eigene Quelle) | power of the PV system in W (0 at night) (further instance, the same placeholder as on “WaermepumpeCloud”); in your own project feed it from your own inverter | —"
Z3_14 = "Switch | PV-Balken zeigen (Govee) | switchable in the app; ON = the light strip shows the PV power as a bar, OFF = bar empty (then choose a colour or white) | —"
Z3_15 = "Formula | PV-Balken in Prozent (Govee) | IF(I2>0;MIN(100;MAX(0;INT(I1/1000)*10));0) – 10 %% steps for a 10 kWp system; for another size replace 1000 by a tenth of the system power in W (6 kWp: 600); a command only goes out when the step changes | I1 = #13, I2 = output Q of #14"
Z3_16 = "Virtual output command (template “LoxBerry MQTT-Gateway”) | Govee: PV-Balken | command at analogue value: publish govee/befehl/geraet1/balken <v.0> (never retain); the first n %% of the pixels light up yellow; needs the pixel count in the plugin, the running service and in the plugin the ticks “Accept commands via MQTT” (tab MQTT) and “Allow write commands” (tab Settings) | Input = #15"
Z1_19 = "Virtual input (name as assigned by the MQTT gateway, plugin Govee) | govee_status_befehle | 1 = the command service of the plugin is running and accepts govee/befehl/…; 0 = “Accept commands via MQTT” is off in the plugin; -1 = should run and stands still | —"
Z1_20 = "Status | Befehlsweg (Govee) | rows: V1 = -1 “command service of the plugin stands still – look at the plugin tab Test”; V1 = 0 “commands via MQTT are off in the plugin – colour as number, scene by id and PV bar do not work; tick ‘Accept commands via MQTT’ in the plugin tab MQTT”; without condition “commands via MQTT are accepted; switching only with the tick ‘Allow write commands’ (tab Settings)”; visualisation ON | V1 = #19"
S1_H6 = "On no. 19 and 20: govee_status_befehle reports the command service of the plugin (1 running, 0 off, -1 stands still). Without it colour as number, scene by id and PV bar do not work; the direct path (dimmer, buttons) keeps working. Under gateway V2 mark this data point additionally as “Noncached”."

