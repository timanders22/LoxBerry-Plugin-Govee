KOPF_ALLE = "Zustand von %d Govee-Leuchten in EINEM Abruf, erzeugt am %s. Diese Datei ersetzt die Einzeldateien je Gerät — nicht beide einlesen, die Titel sind dieselben. Zweimal eingelesen sind zwei Bausteine: Loxone Config legt beim Import neu an und überschreibt nichts."
