GERAETE_ERKLAERUNG = "<b>LAN</b> ist der Regelweg: die Leuchte wird unmittelbar im Heimnetz angesprochen, ohne Konto und ohne Internet. <b>Cloud</b> ist nur für Geräte gedacht, die kein LAN Control können — dort sind Szenen und Segmente nicht möglich. Vergeben Sie feste IP-Adressen im Router, sonst zeigt die Einstellung nach einem Neustart des Routers ins Leere."
GERAETE_HILFE = "<b>Von Hand ausfüllen muss man diese Felder in aller Regel nicht.</b> <i>Geräte suchen</i> trägt SKU und Gerätekennung für jedes gefundene LAN-Gerät selbst ein; für Cloud-Geräte tut das die Geräteliste weiter unten auf dieser Seite. Von Hand ist der Ausnahmefall — etwa, wenn die Leuchte im Netz noch nicht antwortet.<br><b>SKU</b> ist die Modellnummer (englisch <i>stock keeping unit</i> — die Artikelnummer, mit der der Hersteller eine Bauform führt): ein <span class='sm-mono'>H</span> und vier Zeichen, etwa <span class='sm-mono'>H61A8</span> oder <span class='sm-mono'>H6076</span>. Abzulesen auf dem Steuerkasten oder dem Netzteil, in der Govee-App unter den Geräteeinstellungen und auf der Produktseite des Herstellers, dort als Zeile <i>Modell: H61A8 (10 m)</i> — <a href='https://eu.govee.com/de-de/products/govee-rgbic-outdoor-neon-rope-light' target='_blank' rel='noopener'>Beispiel einer Produktseite</a>. Das Plugin braucht sie, weil eine aufgezeichnete Szene nur zu der Bauform passt, an der sie aufgezeichnet wurde.<br><b>Gerätekennung</b> ist die Kennung der einzelnen Leuchte (Ziffern, A bis F und Doppelpunkte, wie eine MAC-Adresse). Sie wird <b>nur für den Cloud-Weg</b> gebraucht; im LAN genügt die IP-Adresse. Zu finden in der Cloud-Geräteliste dieses Plugins oder in der Govee-App unter den Geräteeinstellungen.<br><b>Pixel</b> ist die Anzahl der einzeln steuerbaren Pixel im Graffiti-Betrieb der Govee-App — bei der Stehlampe H6076 sind das 14 Gruppen zu je 6 LEDs, bei der Lichterkette H70C4 sind es 10 Segmente. Abzählen lässt sie sich im Graffiti-Bild der App; auf der Produktseite steht sie nicht. Bleibt das Feld leer, sind Balkenanzeige und Segmentbefehle für dieses Gerät gesperrt; sie werden dann abgewiesen statt ins Leere gesendet.<br><b>K min</b> und <b>K max</b> begrenzen die Farbtemperatur. Beide Enden zeigt der Weißton-Regler der Govee-App an; sie stehen außerdem in der Anleitung des Geräts, in aller Regel aber nicht auf der Produktseite. Bleiben die Felder leer, gelten 2700 und 6500 Kelvin; Werte außerhalb weist das Plugin ab."
