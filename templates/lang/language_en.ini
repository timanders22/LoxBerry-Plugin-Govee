H_UNGEPRUEFT = "What is not tested here"
UNGEPRUEFT = "The self-test compares the generated commands with the reference values recorded in the Loxforum. It proves that this plugin builds the same bytes as the Govee app — it does <b>not</b> prove that <i>your</i> light understands them. Govee assigns scene ids and the form of the segment commands per model series. The recorded templates come from the H6076 floor lamp, the H70C4 light string and an RGBIC strip. What works on your model is a matter of trying."
L_VERFAHREN = "Segment method"
H_VERFAHREN = "<b>Graffiti</b> was measured on the H6076 floor lamp and addresses individual pixels. <b>Bit mask</b> is the form that works on the H70C4 light string and addresses whole segments counted from 1 — for that one the forum post only gives the byte order, no recorded example string. Which form your light understands is a matter of trying: try both."
F_NAMEN = "Does the name table match the sending code?"
A_NAMEN_OK = "yes, %d names – each is a name the gateway sends under, and every topic sent is in the table."
A_NAMEN_FEHL = "no – only in the table: %s; sent but not in the table: %s."
F_V2_HAKEN = "Are the ticks set under gateway V2?"
A_V2_OK = "yes, all %d data points of the tick list are ticked, %d of them as Noncached."
A_V2_FEHLT = "no – not ticked: %s; without Noncached: %s (tab Loxone integration, step 2)."
A_V2_V1 = "Gateway V1 – no ticks needed; the plugin brings the subscription."
A_V2_UNKLAR = "cannot be determined (gateway version or config/system/subscriptions.json not readable)."
F_BRUECKE = "Command bridge (commands via MQTT)"
F_WARTESCHLANGE = "Is the queue separated from the folder of the command bridge?"
A_WS_OK = "yes – jobs are in %s, the command bridge keeps %s."
A_WS_FEHL = "no – queue and folder of the command bridge are the same (%s): the service would delete the files of the bridge."

