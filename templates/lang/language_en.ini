[LOX]
H_TITEL = "Step by step"
S1_T = "Choose the path"
S1 = "There are two directions.<br><b>Reading state</b> — via MQTT: the service polls the lights and publishes the values via the MQTT gateway. In Loxone you create virtual inputs with exactly the names from step 3 – the gateway does not create anything in Loxone by itself. That is the way of the sample project.<br><b>Switching</b> — on/off, brightness, white, fixed colours and scenes still go <b>directly</b> to the light via the virtual outputs from step 6; that also works without the LoxBerry. Continuous colour, scene by id and the bar go to the plugin via MQTT commands (step 5).<br>The way via HTTP (virtual HTTP input, output with token) stays for existing installations – collapsed at the end of this tab."
S2_T = "The MQTT gateway"
S2 = "The topic group of this plugin is:"
S3_T = "Create virtual inputs"
S3 = "For every topic Loxone should evaluate, create a <b>virtual input</b> (for text: <b>virtual text input</b>) with exactly this name in Loxone Config under <i>Virtual inputs</i>. No import template for values – the column “in the sample project” tells which inputs the sample pages need."
T_TITEL = "Title"
T_EINHEIT = "Unit"
T_BEDEUTUNG = "Meaning"
IMPORT_WARNUNG = "Loxone Config creates new objects on import and overwrites nothing. Importing twice means duplicate objects."
KEINE_GERAETE = "No device has been configured yet. Please enter one on the Settings tab first."
S4_T = "Send commands"
S4 = "A virtual output pointing at the LoxBerry with these addresses. Every switching call needs the tick <i>Allow write commands</i> on the Settings tab and a running service."
S4_ODER = "<b>Or without the LoxBerry:</b> the virtual output from step 5 talks to the light directly through <span class='sm-mono'>/dev/udp/&lt;IP&gt;/4003</span>. That is the faster way and it keeps working while the LoxBerry is rebooting. Going through the LoxBerry is only worth it if you want the state reported back."
S5_T = "Failure detection"
S5 = "Virtual inputs keep their last value: if the LoxBerry, the polling service or the MQTT gateway stands still, everything looks normal in the app. That is why the service sends the sign of life %s – it counts up by one with every round of the service (0 to 999, every 30 s by default, never retained). Connect it to a Value Validator: Tmc 300 s (at least five times the polling interval), Min 0, Max 999, constant 1 at En and remove the tick at ‘En’ in the properties window – its output E reports the failure. %s on a NOT reports when the light does not answer. An age computed from a timestamp is not needed; ts and lebt are for display only."
H_VORLAGEN = "Import files for Loxone Config"
VORLAGEN_ERKLAERUNG = "There are up to four files per device. <b>Basic commands</b> and <b>scenes and bars</b> are virtual outputs and talk to the light directly — fast and independent of the LoxBerry, but only with fixed values. <b>Continuous through the LoxBerry</b> is a virtual output as well but goes through the endpoint: there every command carries an analogue value, so continuous brightness, colour as a number, any scene id and a bar in percent steps. <b>State</b> is a virtual input and pulls the values from the LoxBerry. The address in the header is a suggestion — please check that the Miniserver can reach the LoxBerry under that name."
K_VQ = "Basic commands (virtual output)"
K_VQ_SZENEN = "Scenes and bars (virtual output)"
K_VI = "State (virtual input)"
K_VQ_LOX = "Continuous through the LoxBerry (virtual output)"
FEHLER_VORLAGE = "This template does not exist for this device. Virtual outputs are only possible on the LAN path."
H_SAMMEL = "One input for all lights"
SAMMEL_ERKLAERUNG = "Instead of one virtual input per device this single file fetches all values in one poll. With eight lights that is one poll per interval instead of eight. Import <b>either</b> this file <b>or</b> the per-device files above — the titles in this file carry the prefix <span class='sm-mono'>GOVEE_ALLE_</span> and thus differ from those of the per-device files; imported twice still means two blocks on the same address."
K_VI_ALLE = "State of all lights (one virtual input)"
H_TOKEN = "Token"
TOKEN_ERKLAERUNG = "The token protects the endpoint in the unauthenticated area. It is part of every address in the Miniserver."
K_TOKEN_NEU = "Roll a new token"
TOKEN_NEU = "A new token has been created. Every address in the Miniserver has to be updated now."
T_AKTION = "Action"
T_ADRESSE = "Address"
S6_T = "Block lists to rebuild"
S6 = "Three pages from the LoxBerry plugins sample project, built and connected there in Loxone Config: <b>“Govee”</b> shows whether everything is running and what the light is doing (for everybody), <b>“Govee Licht”</b> switches, dims and colours the light directly, <b>“Govee Szenen und Balken”</b> shows scenes, segments and the PV power as a bar. Per page: instructions, table (work through it from top to bottom), notes and picture. The names apply to the first configured light (without a light to “Lichtleiste”, device 1, as in the sample project). Loxone Config finds the blocks through the block search (F5)."
B_TYP = "Block (type)"
B_NAME = "Name"
B_PARAM = "Parameters"
B_EIN = "Connect inputs to"
S7_T = "Cross-check"
S7 = "On the <i>Test</i> tab open <i>Query state</i> in the browser: there has to be a line containing <span class='sm-mono'>OK=1</span>. Then look at <i>Incoming overview</i> in the MQTT gateway to see whether the topics arrive. Only then go looking in Loxone Config — whoever starts at the Miniserver is testing three things at once."
SEGMENT_MASKE = "for lights that know whole segments instead of pixels (H70C4)"
BILD_ALT = "Plugin blocks in Loxone Config"
BILD_UNTERSCHRIFT = "Page “%s” in the LoxBerry plugins sample project. Config shortens long block names – see the table for the full names."
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
EB_MQTT_AUS = "<b>“Publish values via the MQTT gateway” is off in the MQTT tab</b> – then nothing arrives via MQTT. Set the tick and save."
EB_V2 = "<b>Gateway V2:</b> under <i>System → MQTT Gateway → Subscriptions</i> the group %s appears. Tick the data points of the tick list; the one marked [Noncached] additionally as “Noncached”. No data point needs “Reset after send”."
