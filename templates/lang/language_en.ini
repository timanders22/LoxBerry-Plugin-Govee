B5_PARAM = "from the file <i>Scenes and bars</i>"
B5_EIN = "Timer, presence or a push button"
B6_TYP = "Status block"
B6_PARAM = "eleven states, one per 10 percent"
B6_EIN = "PV power through an analogue limiter; outputs to the eleven bar commands"
B7_TYP = "Comparator"
B7_PARAM = "Threshold 3 — reports only on the third consecutive failure"
B7_EIN = "Virtual input <span class='sm-mono'>GOVEE_1_FEHL</span>. If you prefer to go by time, use <span class='sm-mono'>GOVEE_1_ALTER</span> with a threshold well above the polling interval, for example 300 s"
B8_TYP = "Notification block"
B8_PARAM = "Text: Govee light is not answering"
B8_EIN = "Output of #7, combine several lights through OR first"
ZU_TITEL = "Notes"
ZU_3 = "<b>On #3:</b> the Govee LAN interface only accepts brightness from 1 to 100. On the <i>direct</i> path (file <i>Basic commands</i>) the value goes to the light raw: there 0 does not switch off but jumps to the lowest step, and the limiter stays necessary. Through the file <i>Continuous through the LoxBerry</i> the plugin takes the 0 and switches off — then the limiter can go."
ZU_6 = "<b>On #6:</b> the bar needs a stored pixel count. The file <i>Scenes and bars</i> holds eleven fixed commands for 0, 10, 20 up to 100 percent. For finer steps take the file <i>Continuous through the LoxBerry</i>: it holds a single command with an analogue value, and the status block from #6 becomes unnecessary."
ZU_8 = "<b>On #8:</b> the notification block only fires on the change from off to on. Never wire several sources straight to its input — combine them through OR first, otherwise one permanently active source swallows all the others."
S7_T = "Cross-check"
S7 = "On the <i>Test</i> tab open <i>Query state</i> in the browser: there has to be a line containing <span class='sm-mono'>OK=1</span>. Then look at <i>Incoming overview</i> in the MQTT gateway to see whether the topics arrive. Only then go looking in Loxone Config — whoever starts at the Miniserver is testing three things at once."
SEGMENT_MASKE = "for lights that know whole segments instead of pixels (H70C4)"

