[MQTT]
ABO_GEMESSEN = "(gemessen: Gateway&nbsp;V%d)"
ABO_TEXT = "Die Themengruppe dieses Plugins lautet:"
ABO_UNBEKANNT = "Welche Fassung Ihr MQTT&#8209;Gateway hat, ließ sich nicht feststellen. <b>Fassung&nbsp;1:</b> ohne diesen Eintrag kommt am Miniserver nichts an. <b>Fassung&nbsp;2 und neuer:</b> die Themengruppe erscheint von selbst in den Subscriptions, einzutragen ist nichts."
ABO_V2 = "<b>MQTT&#8209;Gateway V2 erkennt die Themengruppe von selbst</b> — einzutragen ist hier nichts. In den <i>Subscriptions</i> erscheint die Gruppe; dort werden die gewünschten Datenpunkte einzeln angehakt. Erscheint sie nicht, hat noch nichts veröffentlicht."
ABO_WARNUNG = "Ohne diesen Eintrag kommt am Miniserver nichts an. Das ist die häufigste Fehlerursache überhaupt. Die Zeile gehört unter <i>System → MQTT Gateway</i> in den Abschnitt <i>Subscriptions</i>; danach speichern."
ERKLAERUNG = "Das MQTT-Gateway ist seit LoxBerry 3 Bestandteil des Systems — es wird nicht nachinstalliert, sondern unter <i>System → MQTT Gateway</i> eingeschaltet. Der Brokername steht ab Werk auf <span class='sm-mono'>localhost</span>; ob Nachrichten ankommen können, sagt allein der Autostart."
H_ABO = "Das Abo im Gateway"
H_THEMEN = "Veröffentlichte Themen"
H_ZUSTAND = "Zustand des Gateways"
N_ERKLAERUNG = "<b>N</b> steht für die Nummer des Geräts aus der Liste im Reiter Einstellungen — das erste Gerät ist die 1. Werte, die eine antwortende Leuchte nicht liefert (an, hell, kelvin, r, g, b), gehen als -1 hinaus; eine erfundene 0 wäre eine stille Falschaussage. Zustände (Spalte retained) behält der Broker, bis ein neuer Wert kommt. Gesendet wird nur, was sich geändert hat; den vollen Satz gibt es beim Start des Dienstes und alle 30 Minuten. status/zaehler ändert sich in jeder Dienstrunde, status/befehle sendet die Befehlsbrücke jede Minute. Antwortet eine Leuchte nicht mehr (erreichbar 0), gehen nur erreichbar, alter und fehl hinaus. Ein aus der Liste entferntes Gerät meldet einmal erreichbar 0, alter -1 und fehl -1, und seine zurückbehaltenen Themen werden abgeräumt; die Deinstallation räumt alle zurückbehaltenen Themen unter diesem Präfix ab."
