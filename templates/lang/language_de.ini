B8_TYP = "Benachrichtigungs-Baustein"
B8_PARAM = "Text: Govee-Leuchte antwortet nicht"
B8_EIN = "Ausgang von #7, mehrere Leuchten vorher über ODER zusammenführen"
ZU_TITEL = "Erläuterungen"
ZU_3 = "<b>Zu #3:</b> Die Govee-LAN-Schnittstelle nimmt Helligkeit nur von 1 bis 100 an. Auf dem <i>unmittelbaren</i> Weg (Datei <i>Grundbefehle</i>) geht der Wert roh an die Leuchte: dort schaltet 0 nicht aus, sondern springt auf die kleinste Stufe, und der Begrenzer bleibt nötig. Über die Datei <i>Stufenlos über den LoxBerry</i> nimmt das Plugin die 0 entgegen und schaltet aus — dann kann der Begrenzer entfallen."
ZU_6 = "<b>Zu #6:</b> Der Balken braucht eine hinterlegte Pixelzahl. Die Datei <i>Szenen und Balken</i> enthält elf feste Befehle für 0, 10, 20 bis 100 Prozent. Wer feiner abstufen will, nimmt die Datei <i>Stufenlos über den LoxBerry</i>: dort steht ein einziger Befehl mit einem Analogwert, und der Statusbaustein aus #6 entfällt."
ZU_8 = "<b>Zu #8:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen unmittelbar an seinen Eingang — erst über ODER zusammenführen, sonst verschluckt eine dauerhaft aktive Quelle alle übrigen."
S7_T = "Gegenprobe"
S7 = "Im Reiter <i>Test</i> den Knopf <i>Zustand abfragen</i> im Browser öffnen: dort muss eine Zeile mit <span class='sm-mono'>OK=1</span> stehen. Danach im MQTT-Gateway unter <i>Incoming overview</i> nachsehen, ob die Themen ankommen. Erst dann in Loxone Config suchen — wer mit dem Miniserver anfängt, prüft drei Dinge auf einmal."
